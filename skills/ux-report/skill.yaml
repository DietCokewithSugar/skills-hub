id: ux-report
name: 体验评测报告
version: 0.3.0
description: 输入问卷导出数据，产出结构化体验评测 Word 报告
runtime: python-3.12
requirements: requirements.txt

inputs:
  - key: raw_data
    label: 问卷导出文件
    type: file
    accept: [.csv, .xlsx]
    required: true

steps:
  - id: confirm_scope
    type: interaction
    label: 确认评测范围
    card: cards/scope.json
  - id: compute
    type: python
    label: 计算指标
    entry: steps/compute.py
    output_schema: schemas/compute.json
  - id: narrate
    type: llm
    label: 撰写结论
    prompt: prompts/narrate.md
    response_schema: schemas/narrate.json
  - id: render
    type: python
    label: 生成报告
    entry: steps/render.py

outputs:
  - path: output/report.docx
    label: 体验评测报告

references:
  - path: refs/methodology.md
    load: on_demand          # 渐进式披露：默认只进 description，模型需要时才读全文
    description: NPS/CSAT/任务完成率的口径定义与评级标准
  - path: refs/glossary.md
    load: always

# R0.4：数据异常时在计算前中断，而不是照算不误
data_contract:
  required_columns: [scope, nps, csat, task_success]
  min_rows: 30
  max_null_ratio: 0.2

limits:
  timeout_s: 180
  memory_mb: 1024
