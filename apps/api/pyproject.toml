[project]
name = "bench-api"
version = "0.1.0"
description = "Bench（工位）— 在线 Skill 执行平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    "openai>=1.55",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-multipart>=0.0.17",
    "docxtpl>=0.18",
    "python-docx>=1.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "e2b>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.8",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2b: 需要真实 E2B 凭据，未配置时跳过",
    "db: 需要真实 Postgres 连接，未配置时跳过",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
