# 本地开发依赖。数据与对象存储走 Supabase 云（见 .env），这里只起队列。
services:
  redis:
    image: redis:7-alpine
    container_name: bench-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
